<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>5-Year LLB Portal - Redirecting</title>
    <script type="text/javascript">
      // GitHub Pages SPA client-side routing fallback script
      // Encodes the broken sub-path route and sends it to index.html as a query param
      const pathSegmentsToKeep = 1; // 1 because repo name is a subfolder /5-YearLLB/
      const l = window.location;
      
      // Convert path to hash or query parameter
      const targetPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      const searchParams = l.search ? l.search : '';
      const hashParam = l.hash ? l.hash : '';
      
      // Redirect back to root index.html with the original target as a query parameter
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?p=' + encodeURIComponent(targetPath) +
        (searchParams ? '&q=' + encodeURIComponent(searchParams) : '') +
        hashParam
      );
    </script>
  </head>
  <body>
    <p>Redirecting to learning portal...</p>
  </body>
</html>
